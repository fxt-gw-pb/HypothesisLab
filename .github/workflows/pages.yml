name: Deploy hypothesis laboratory to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
      - name: Install locked dependencies
        run: npx --yes pnpm@11.25.0 install --frozen-lockfile
      - name: Check static application types
        run: npm run typecheck:pages
      - name: Lint static entry and configuration
        run: npx eslint pages/main.tsx vite.pages.config.ts
      - name: Build static site
        run: npm run build:pages
      - name: Upload static site
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
